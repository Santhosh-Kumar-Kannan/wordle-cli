[tool.pytest.ini_options]
# Lets tests do `from game import ...` from the project root.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = import sorting, B = bugbear,
# UP = modern syntax, D = docstring rules (public classes/functions)
select = ["E", "W", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.per-file-ignores]
# Test functions are named after what they check, so skip docstring rules there.
"tests/*" = ["D"]
